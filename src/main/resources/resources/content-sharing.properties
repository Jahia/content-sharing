cshmix_sharedUrl: Share protected content
cshmix_sharedUrl.cshare_sharedUrl: General access
cshmix_sharedUrl.cshare_sharedUrl.ui.tooltip: For anonymous visitors (guests), only those with this link can access the content
cshmix_sharedUrl.cshare_sharedUrlExpiry: Link expiry date
cshmix_sharedUrl.cshare_sharedUrlExpiry.ui.tooltip: After this date the link stops working. Leave empty for a link that never expires.
sharedLink.notice: You are viewing shared content. Links on this page lead to pages you may not be able to open.
cshmix_reviewUrl: Share for review before publication
cshmix_reviewUrl.cshare_reviewUrl: Review link
cshmix_reviewUrl.cshare_reviewUrl.ui.tooltip: Shows the content as it stands here, including changes that are not published. Give this link only to people you want to review the draft.
cshmix_reviewUrl.cshare_reviewUrlExpiry: Review link expiry date
cshmix_reviewUrl.cshare_reviewUrlExpiry.ui.tooltip: Required. A review link without an expiry date does not work. Reviewers are outside the site, so the link has to stop on its own.
reviewLink.notice: You are reviewing a draft. It is not published, it may still change, and links on this page lead to pages you may not be able to open.
cshnt_reviewLink: Review link
cshnt_reviewLink.cshare_key: Key
cshnt_reviewLink.cshare_key.ui.tooltip: The secret part of the link. Whoever holds the link reads the draft until it expires.
cshnt_reviewLink.cshare_expiry: Expiry date
cshnt_reviewLink.cshare_expiry.ui.tooltip: The link stops working after this date.
cshnt_reviewLink.cshare_owner: Shared content
cshnt_reviewLink.cshare_owner.ui.tooltip: Identifier of the content the link opens. A copied link opens nothing.
cshnt_reviewLinks: Review links
cshmix_reviewLinks: Holds review links
