cshmix_sharedUrl: Partager un contenu prot\u00e9g\u00e9
cshmix_sharedUrl.cshare_sharedUrl: Acc\u00e8s g\u00e9n\u00e9ral
cshmix_sharedUrl.cshare_sharedUrl.ui.tooltip: Pour les visiteurs anonymes (guest), seuls ceux avec ce lien peuvent acc\u00e9der au contenu
cshmix_sharedUrl.cshare_sharedUrlExpiry: Date d'expiration du lien
cshmix_sharedUrl.cshare_sharedUrlExpiry.ui.tooltip: Apr\u00e8s cette date le lien cesse de fonctionner. Laissez vide pour un lien sans expiration.
sharedLink.notice: Vous consultez un contenu partag\u00e9. Les liens de cette page m\u00e8nent \u00e0 des pages que vous ne pourrez peut-\u00eatre pas ouvrir.
cshmix_reviewUrl: Partager pour relecture avant publication
cshmix_reviewUrl.cshare_reviewUrl: Lien de relecture
cshmix_reviewUrl.cshare_reviewUrl.ui.tooltip: Montre le contenu tel qu'il est ici, y compris les modifications non publi\u00e9es. Ne donnez ce lien qu'aux personnes qui doivent relire le brouillon.
cshmix_reviewUrl.cshare_reviewUrlExpiry: Date d'expiration du lien de relecture
cshmix_reviewUrl.cshare_reviewUrlExpiry.ui.tooltip: Obligatoire. Un lien de relecture sans date d'expiration ne fonctionne pas. Les relecteurs sont ext\u00e9rieurs au site, le lien doit donc s'arr\u00eater de lui-m\u00eame.
reviewLink.notice: Vous relisez un brouillon. Il n'est pas publi\u00e9, il peut encore changer, et les liens de cette page m\u00e8nent \u00e0 des pages que vous ne pourrez peut-\u00eatre pas ouvrir.
