# Runs on every pull request. This repository had no CI at all, so the goal here is a floor: the
# module must compile, the front-end must lint, and the static analysers must stay clean. When the
# repository is onboarded to the organisation's shared pipeline, replace the `build` job with
# `jahia/jahia-modules-action/build@v2` and add `update-signature` + `sonar-analysis`.
name: On Code Change (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  # Lets a release be cut from a tag: the jar that ships must be a CI build, because
  # jahia-maven-plugin writes the local build path into the manifest of a developer's build.
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # The 8.2 parent POM compiles with --release 11; 17 is the highest JDK Jahia modules target.
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build
        env:
          JAHIA_DISABLE_SOURCE_FOLDERS: "true"
        run: mvn --batch-mode --no-transfer-progress install

      # A jar carrying Jahia-Source-Folders is a developer's build and must never be released.
      - name: Refuse a jar that carries a build path
        run: |
          JAR=$(ls target/*.jar | grep -v sources | head -1)
          echo "checking $JAR"
          if unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -q 'Jahia-Source-Folders'; then
            unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep 'Jahia-Source-Folders'
            echo "::error::the manifest carries a build path; this jar cannot be released"
            exit 1
          fi
          echo "no Jahia-Source-Folders in the manifest"

      - name: Refuse a jar with no front-end
        run: |
          JAR=$(ls target/*.jar | grep -v sources | head -1)
          if ! unzip -l "$JAR" | grep -q 'javascript/apps/remoteEntry.js'; then
            echo "::error::the jar has no javascript/apps/remoteEntry.js, so the editor field would not load"
            exit 1
          fi
          echo "remoteEntry.js is in the jar"

      - uses: actions/upload-artifact@v4
        with:
          name: module-jar
          path: target/*.jar
          retention-days: 30

  javascript:
    name: Check the front-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      # Reports, does not block: the advisories present today are pre-existing and all but one
      # are build-time only. Blocking here would mean the gate can never pass, which teaches the
      # team to ignore it. Tighten this once html-parse-stringify2 (via react-i18next@11) is off
      # the runtime path.
      - name: Audit dependencies
        continue-on-error: true
        run: yarn audit --level high --groups dependencies

  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: semgrep scan --config p/java --config p/javascript --config p/owasp-top-ten
               --error --metrics=off src

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # gitleaks-action@v2 refuses to run for a GitHub organization without a paid licence key,
      # so this drives the CLI, which has no such restriction.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
